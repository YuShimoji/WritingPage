  <script>
    (function () {
      // ?reset=1でlocalStorageをクリア
      if (/(?:^|[?&])reset=1(?:&|$)/.test(location.search)) {
        try {
          localStorage.clear();
          // クエリパラメータを削除してリロード
          var url = location.origin + location.pathname;
          location.replace(url);
          return;
        } catch (e) { /* ignore */ }
      }

      // 埋め込みモード判定（?embed=1）
      var isEmbed = /(?:^|[?&])embed=1(?:&|$)/.test(location.search);
      if (isEmbed) {
        document.documentElement.setAttribute('data-embed', 'true');
      }
      try {
        var raw = localStorage.getItem('zenWriter_settings');
        var settings = null;
        if (raw) {
          settings = JSON.parse(raw);
        }

        // テーマ設定（デフォルト: dark）
        var theme = settings && settings.theme ? settings.theme : 'dark';
        document.documentElement.setAttribute('data-theme', theme);

      // UIモード設定（統合シェル既定: normal。reader/blank/focus は normal へ正規化）
        var uiMode = (settings && settings.ui && settings.ui.uiMode) ? settings.ui.uiMode : 'normal';
        if (uiMode === 'reader' || uiMode === 'blank' || uiMode === 'focus') uiMode = 'normal';
        document.documentElement.setAttribute('data-ui-mode', uiMode);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('data-ui-mode', 'normal');
      }
    })();
  </script>

  <style id="manuscript-page-style">
    .zw-intertitle, .zw-spoiler { margin-block: 1.5em; overflow-wrap: anywhere; }
    .zw-intertitle {
      padding-block: 1.25em; padding-inline: .75em; text-align: center;
      border-block: 1px solid color-mix(in srgb, currentColor 32%, transparent);
    }
    .zw-intertitle .zw-reading-title { font-size: 1.35em; font-weight: 600; letter-spacing: .08em; }
    .zw-intertitle > p { text-align: center; text-indent: 0; margin-block: .45em 0; }
    .zw-spoiler {
      border-inline-start: .18em solid currentColor; padding: .65em 1em;
      background: color-mix(in srgb, currentColor 6%, transparent);
    }
    .zw-spoiler > .zw-reading-title { font-weight: 600; }
    .zw-spoiler > summary { cursor: pointer; }
    .zw-spoiler > summary:focus-visible { outline: 2px solid currentColor; outline-offset: .12em; }
    .zw-spoiler > :last-child { margin-block-end: 0; }
    @keyframes zw-reading-fade { from { opacity: .45; } to { opacity: 1; } }
    @media screen and (prefers-reduced-motion: no-preference) {
      :root:not([data-reduce-motion="true"]) details.zw-spoiler[open] > :not(summary) { animation: zw-reading-fade .24s ease-out; }
      @supports (animation-timeline: view()) {
        :root:not([data-reduce-motion="true"]) :is(#reader-preview, #manuscript-export) .zw-intertitle > .zw-reading-title {
          animation: zw-reading-fade linear both;
          animation-timeline: view(); animation-range: entry 0% entry 100%;
        }
      }
    }
    @media print { details.zw-spoiler::details-content { content-visibility: visible; } }
    .zw-inquiry {
      display: flex; flex-wrap: wrap; align-items: start; gap: .85em 1.25em;
      margin-block: 1.5em; padding: 1em;
      border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
      background: color-mix(in srgb, currentColor 3%, transparent);
      overflow-wrap: anywhere;
    }
    .zw-inquiry > header {
      flex: 0 0 100%; font-size: 1.35em; font-weight: 650;
      border-block-end: 1px solid color-mix(in srgb, currentColor 28%, transparent);
      padding-block-end: .35em;
    }
    .zw-inquiry > blockquote {
      flex: 2 1 16em; min-inline-size: 0; margin: 0; padding: 0; border: 0;
      background: transparent; color: inherit; font-style: normal;
    }
    .zw-inquiry-side { display: grid; gap: .5em; flex: 1 1 13em; min-inline-size: 0; }
    .zw-inquiry-side > .zw-spoiler { margin: 0; padding: .5em .75em; }
    .zw-inquiry-side > :not(.zw-spoiler) { margin: 0; }
    .zw-inquiry p { text-indent: 0; }
    .zw-inquiry p:first-child { margin-block-start: 0; }
    .zw-inquiry p:last-child { margin-block-end: 0; }
    .play-diary-scene {
      display: flex;
      flex-wrap: wrap;
      align-items: start;
      gap: 0.75em 1.5em;
      margin-block: 1.25em;
      overflow-wrap: anywhere;
    }
    .play-diary-scene > * { flex: 1 1 15em; min-inline-size: 0; }
    .play-diary-scene > .play-diary-day {
      flex: 0 0 100%;
      font-weight: 650;
      color: inherit;
    }
    .play-diary-dialogue { display: grid; gap: 1em; }
    .play-diary-turn { min-inline-size: 0; padding-inline-start: 0.9em; border-inline-start: 0.16em solid currentColor; }
    .play-diary-turn[data-speaker="npc"] { margin-inline-end: 1.4em; }
    .play-diary-turn[data-speaker="player"] {
      margin-inline-start: 1.4em; padding-inline: 0.8em; padding-block: 0.55em;
      border-inline-start: 0; border-inline-end: 0.16em solid currentColor;
      background: color-mix(in srgb, currentColor 5%, transparent);
    }
    .play-diary-scene .play-diary-turn > blockquote {
      margin: 0; padding: 0; border: 0; background: transparent; color: inherit; font-style: normal;
    }
    .play-diary-note { padding: 0.75em 1em; background: color-mix(in srgb, currentColor 7%, transparent); }
    .play-diary-caption {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.1em 0.65em;
      margin-block-end: 0.45em; font: 650 0.84em/1.4 system-ui, sans-serif;
    }
    .play-diary-caption strong { font-size: 1.16em; }
    .play-diary-scene p { text-indent: 0; margin-block: 0 0.6em; }
    .play-diary-scene p:last-child { margin-block-end: 0; }
    .play-diary-scene blockquote em { font-size: 0.91em; }
    .play-diary-scene img { display: block; max-width: 100%; height: auto; }
    .play-diary-note img + br:has(+ em:last-child) { display: none; }
    .play-diary-note img + br + em:last-child {
      display: block; margin-block-start: .4em; font-size: .88em;
    }
    .play-diary-navigation { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.75em; margin-block: 1.5em; }
    #manuscript-export:has(#diary-contents) > h1 { margin-block: .6em .75em; text-wrap: balance; }
    #manuscript-export #diary-contents {
      margin-block: 1em 1.6em; padding: .7em 1em; min-inline-size: 0;
      border: 1px solid color-mix(in srgb, currentColor 26%, transparent);
    }
    #manuscript-export #diary-contents h2 { margin-block: 0 .35em; font-size: 1em; }
    #manuscript-export #diary-contents ol { margin: 0; padding-inline-start: 1.5em; }
    #diary-contents a, .play-diary-navigation a { color: inherit; text-decoration: underline; text-underline-offset: 0.18em; }
    [data-manuscript-direction="vertical"] {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      --page-flow: to left;
      --page-edges: to bottom;
    }
    :is(#editor, #wysiwyg-editor, #editor-preview, #reader-preview-inner, #print-view, #manuscript-export)[data-manuscript-measure] {
      box-sizing: border-box;
      inline-size: min(100%, calc(var(--manuscript-measure) + 2 * var(--manuscript-inset, 0px)));
      max-inline-size: 100%;
      padding-inline: var(--manuscript-inset, 0px);
    }
    [data-page-frame] {
      --page-line: color-mix(in srgb, currentColor 28%, transparent);
      background-image:
        linear-gradient(var(--page-edges, to right), var(--page-line) 1px, transparent 1px, transparent calc(100% - 1px), var(--page-line) 0),
        repeating-linear-gradient(var(--page-flow, to bottom), var(--page-line) 0 1px, transparent 1px var(--manuscript-page));
      background-attachment: local;
      background-origin: content-box;
      background-clip: content-box;
      background-repeat: no-repeat;
      print-color-adjust: exact;
    }
  </style>
  <script>
    // フォント読み込み: ローカル優先、失敗時のみ Google Fonts へフォールバック
    (function () {
      try {
        var isEmbed = /(?:^|[?&])embed=1(?:&|$)/.test(location.search);
        if (isEmbed) return;
        var head = document.getElementsByTagName('head')[0];
        function appendStylesheet(href, onError) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = href;
          if (typeof onError === 'function') link.onerror = onError;
          head.appendChild(link);
          return link;
        }
        function appendGoogleFonts() {
          if (head.getAttribute('data-fonts-cdn') === '1') return;
          head.setAttribute('data-fonts-cdn', '1');
          var l1 = document.createElement('link');
          l1.rel = 'preconnect';
          l1.href = 'https://fonts.googleapis.com';
          var l2 = document.createElement('link');
          l2.rel = 'preconnect';
          l2.href = 'https://fonts.gstatic.com';
          l2.crossOrigin = '';
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = 'https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap';
          head.appendChild(l1);
          head.appendChild(l2);
          head.appendChild(css);
        }
        // ?fonts=cdn でCDNを明示利用
        if (/(?:^|[?&])fonts=cdn(?:&|$)/.test(location.search)) {
          appendGoogleFonts();
          return;
        }
        var fallbackTriggered = false;
        function fallbackToCdn() {
          if (fallbackTriggered) return;
          fallbackTriggered = true;
          appendGoogleFonts();
        }
        appendStylesheet('vendor/fonts/400.css', fallbackToCdn);
        appendStylesheet('vendor/fonts/700.css', fallbackToCdn);
      } catch (_) { }
    })();
  </script>
</head>

  <script>
    // PWA install support (localhost / https only)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // 開発モード判定
        var isDev = location.hostname === 'localhost' ||
                    location.hostname === '127.0.0.1' ||
                    location.protocol === 'file:';

        // ?clearCache=1 でService Workerのキャッシュをクリア
        if (isDev && /(?:^|[?&])clearCache=1(?:&|$)/.test(location.search)) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) {
              registration.unregister();
            });
          });
          caches.keys().then(function(names) {
            names.forEach(function(name) {
              caches.delete(name);
            });
          }).then(function() {
            // クエリパラメータを削除してリロード
            var url = location.origin + location.pathname;
            location.replace(url);
          });
          return;
        }

        // 開発時は Service Worker を登録しない（キャッシュ汚染防止）
        var forceSW = /(?:^|[?&])useSW=1(?:&|$)/.test(location.search);
        if (isDev && !forceSW) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) {
              registration.unregister();
            });
          }).catch(function () { });
          return;
        }

        navigator.serviceWorker.register('/sw.js').catch(function () { });
      });
    }
  </script>

  <div id="print-view" class="print-view" aria-hidden="true"></div>
  <!-- SP-078+: 再生オーバーレイ -->
  <div class="reader-preview" id="reader-preview" role="document" aria-label="再生オーバーレイ" aria-describedby="reader-mode-hint">
    <p class="reader-preview__mode-hint" id="reader-mode-hint">再生オーバーレイ · 閲覧のみ（編集は「編集に戻る」）</p>
    <div class="reader-preview__controls" id="reader-preview-controls">
      <button class="reader-preview__back-fab" id="reader-back-fab" type="button" aria-label="編集に戻る（再生オーバーレイを終了）">編集に戻る</button>
      <button class="reader-preview__export-btn" id="reader-export-html" type="button" aria-label="HTMLとして保存（再生オーバーレイ）">HTMLとして保存</button>
      <button class="reader-preview__vertical-toggle" id="reader-vertical-toggle" type="button" aria-pressed="false" title="この文書の縦書き/横書き切替" aria-label="この文書を縦書きに切り替え">縦書き</button>
    </div>
    <div class="reader-preview__inner" id="reader-preview-inner"></div>
  </div>

  <div class="memo-field-lab" id="memo-field-lab" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="memo-field-lab-title">
    <div class="memo-field-lab__chrome">
      <div class="memo-field-lab__heading">
        <p class="memo-field-lab__eyebrow">Experimental / Side Quest</p>
        <h2 id="memo-field-lab-title">浮遊メモ実験</h2>
        <p class="memo-field-lab__hint">DOM + CSS 3D で空中を漂うメモを検証します。つかむと前面へ、離すと慣性つきで背景へ戻ります。</p>
      </div>
      <button class="memo-field-lab__close" id="memo-field-lab-close" type="button" aria-label="浮遊メモ実験を閉じる">閉じる</button>
    </div>
    <div class="memo-field-lab__viewport" id="memo-field-lab-viewport" aria-label="浮遊メモ実験のシーン">
      <div class="memo-field-lab__scene" id="memo-field-lab-scene" aria-hidden="true"></div>
    </div>
  </div>
</body>
